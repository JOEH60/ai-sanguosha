<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 三国杀 · 上帝视角</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 65% at 50% 46%, #1d4030 0%, #16302a 42%, #101a1c 72%, #0a0e12 100%);
    color: #e8e2d5;
  }
  /* ===== 顶栏 ===== */
  header {
    height: 52px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; border-bottom: 1px solid #26362f; background: rgba(10,14,18,.72);
    backdrop-filter: blur(6px); position: relative; z-index: 5;
  }
  header h1 { font-size: 19px; color: #f6c344; letter-spacing: 3px; white-space: nowrap; }
  header h1 small { font-size: 12px; color: #6d7f77; letter-spacing: 1px; margin-left: 10px; }
  header .status { font-size: 13px; color: #8b90a0; white-space: nowrap; }
  header .status b { color: #f6c344; }
  header .hright { display: flex; align-items: center; gap: 14px; }
  #voiceBtn {
    font-size: 12px; padding: 4px 13px; border-radius: 14px; cursor: pointer; white-space: nowrap;
    border: 1px solid #3d5c4c; background: #16211c; color: #9fd8b4; transition: .18s;
  }
  #voiceBtn:hover { border-color: #f6c344; color: #f6c344; }
  #voiceBtn.off { color: #6b7280; border-color: #333b45; background: #14171c; }
  #voiceBtn.pulse { animation: vpulse 1.6s infinite; }
  @keyframes vpulse { 50% { box-shadow: 0 0 0 4px rgba(246,195,68,.18); } }
  /* ===== 牌桌 ===== */
  #tableWrap { position: relative; height: calc(100vh - 96px); margin: 0 20px; }
  #tableWrap::before {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: min(78vh, 82%); height: min(78vh, 82%); border-radius: 50%;
    border: 1px solid rgba(246,195,68,.14);
    box-shadow: inset 0 0 90px rgba(0,0,0,.5), 0 0 0 14px rgba(255,255,255,.012);
    pointer-events: none;
  }
  /* 座位：五芒环绕 */
  .seat {
    position: absolute; width: 252px; padding: 8px 11px 9px;
    background: linear-gradient(180deg, #212633 0%, #171b24 100%);
    border: 1px solid #343c4d; border-radius: 12px;
    box-shadow: 0 10px 26px rgba(0,0,0,.5);
    transition: box-shadow .25s, border-color .25s;
  }
  .seat.pos1 { left: 50%; bottom: 4px; transform: translateX(-50%); width: 300px; }
  .seat.pos2 { right: 6%; bottom: 27%; }
  .seat.pos3 { right: 9%; top: 2%; }
  .seat.pos4 { left: 9%; top: 2%; }
  .seat.pos5 { left: 6%; bottom: 27%; }
  .seat.acting { border-color: #f6c344; box-shadow: 0 0 0 2px rgba(246,195,68,.85), 0 0 26px rgba(246,195,68,.3); }
  .seat.dead { opacity: .42; filter: grayscale(.9); }
  .seat.lord::after {
    content: "主公位"; position: absolute; top: -9px; left: 12px; font-size: 10px;
    background: #f6c344; color: #12141a; padding: 1px 7px; border-radius: 7px; font-weight: bold;
  }
  .srow { display: flex; align-items: center; gap: 6px; }
  .sno { font-size: 12px; color: #7d879a; }
  .gname { font-size: 17px; font-weight: bold; color: #f6c344; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 8px; color: #12141a; font-weight: bold; }
  .mname { font-size: 11px; color: #79839a; margin: 1px 0 2px; }
  .hp { font-size: 13px; letter-spacing: 1px; color: #ff6b6b; margin-bottom: 5px; }
  .hp .lost { color: #3c4353; }
  .cards { display: flex; flex-wrap: wrap; gap: 4px; }
  .card { font-size: 11.5px; line-height: 1.5; padding: 1px 6px; border-radius: 5px; background: #2b3040; border: 1px solid #3a4155; }
  .card.s { color: #ff8a7a; border-color: #5f3230; }
  .card.d { color: #f6c344; border-color: #5b4c22; }
  .card.p { color: #ff9ecb; border-color: #573347; }
  .card.t { color: #78d8a0; border-color: #2f5540; }
  .empty { font-size: 11px; color: #4e5666; }
  .think { font-size: 11px; color: #58d0c0; margin-top: 4px; animation: blink 1.1s infinite; }
  @keyframes blink { 50% { opacity: .28; } }
  .deadmark { position: absolute; right: 10px; top: 8px; font-size: 11px; color: #ff5252; font-weight: bold; letter-spacing: 2px; }
  /* ===== 桌心 ===== */
  #center {
    position: absolute; left: 50%; top: 47%; transform: translate(-50%,-50%);
    width: min(600px, 40vw); height: 56%; display: flex; flex-direction: column; gap: 8px;
  }
  .pills { display: flex; justify-content: center; gap: 8px; }
  .pill {
    font-size: 12px; padding: 3px 11px; border-radius: 11px;
    background: rgba(20,28,26,.85); border: 1px solid #2f4a3e; color: #9fb3aa;
  }
  .pill.gold { color: #f6c344; border-color: #5a4a1f; }
  #feed {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px;
    padding: 12px 14px; border-radius: 14px;
    background: rgba(9,14,13,.62); border: 1px solid rgba(120,200,170,.1);
    scrollbar-width: thin;
  }
  #feed::-webkit-scrollbar { width: 6px; }
  #feed::-webkit-scrollbar-thumb { background: #2e4a3e; border-radius: 3px; }
  .msg { font-size: 13px; line-height: 1.5; padding: 4px 9px; border-radius: 7px; background: rgba(255,255,255,.035); }
  .msg.turn { color: #f6c344; background: transparent; text-align: center; font-weight: bold; }
  .msg.round { color: #78d8a0; background: transparent; text-align: center; font-size: 11px; letter-spacing: 3px; }
  .msg.sha { color: #f0b8a8; }
  .msg.dodge { color: #8fd0ff; }
  .msg.hit { color: #ff7a6e; }
  .msg.death { color: #ff5252; font-weight: bold; background: rgba(255,60,60,.1); }
  .msg.tao { color: #ff9ecb; }
  .msg.steal, .msg.dismantle { color: #c3b3ff; }
  .msg.draw { color: #78d8a0; }
  .msg.duel, .msg.duel-fight { color: #ffcf7a; }
  .msg.duel-lose { color: #ff8f6e; }
  .msg.sys { color: #6f7787; font-size: 11.5px; }
  .msg.bad { color: #b99a5b; font-size: 11.5px; }
  .msg.roles { color: #58d0c0; font-size: 11.5px; background: rgba(88,208,192,.07); }
  .msg.bet { color: #ffe084; background: rgba(255,224,132,.09); }
  .msg.win { color: #ffe084; font-size: 15px; font-weight: bold; background: rgba(255,224,132,.14); text-align: center; }
  .msg.start { color: #a8b6c8; font-size: 12px; }
  /* ===== 底部战绩条 ===== */
  #board {
    height: 44px; display: flex; align-items: center; gap: 18px; padding: 0 22px;
    font-size: 12px; color: #7d8a93; border-top: 1px solid #1e2a26; background: rgba(8,12,14,.6);
    overflow: hidden; white-space: nowrap;
  }
  #board b { color: #d8d2c4; }
  #board .tag { color: #4e5a55; }
  /* ===== 押注弹窗 ===== */
  #overlay {
    position: fixed; inset: 0; background: rgba(5,9,8,.84); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 20;
  }
  #overlay .panel {
    background: linear-gradient(180deg, #1e2530, #151a22); border: 1px solid #3a4355;
    border-radius: 16px; padding: 26px 34px 24px; width: 470px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
  }
  #overlay h2 { color: #f6c344; font-size: 19px; letter-spacing: 2px; margin-bottom: 6px; }
  #overlay p { color: #7d879a; font-size: 12px; margin-bottom: 16px; }
  .choice-row { display: flex; gap: 9px; margin-bottom: 14px; }
  .choice {
    flex: 1; padding: 11px 6px; border-radius: 10px; border: 1px solid #3a4355;
    background: #1b202b; cursor: pointer; font-size: 14px; color: #d8d2c4; transition: .18s;
  }
  .choice small { display: block; font-size: 10px; color: #7d879a; margin-top: 3px; }
  .choice.sel { border-color: #f6c344; background: #2c2716; color: #f6c344; }
  #amount {
    width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #3a4355;
    background: #10151b; color: #e8e2d5; font-size: 14px; margin-bottom: 13px; text-align: center;
  }
  #goBtn {
    width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(180deg, #f8d165, #e0a92a); color: #12141a; font-size: 16px; font-weight: bold;
  }
  #goBtn:disabled { opacity: .45; }
  #againFloat {
    position: fixed; right: 26px; bottom: 60px; display: none; z-index: 15; cursor: pointer;
    padding: 11px 24px; border-radius: 24px; border: 1px solid #f6c344; font-size: 14px;
    background: rgba(18,24,20,.92); color: #f6c344; box-shadow: 0 10px 28px rgba(0,0,0,.55);
  }
  /* ===== 上桌选项 ===== */
  .joinrow { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; font-size: 13px; color: #b9c2b6; }
  .joinrow label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .joinrow input[type=checkbox] { width: 15px; height: 15px; accent-color: #f6c344; cursor: pointer; }
  .joinrow select { background: #10151b; color: #e8e2d5; border: 1px solid #3a4355; border-radius: 7px; padding: 4px 8px; font-size: 12px; }
  .joinrow select:disabled { opacity: .4; }
  /* ===== 真人操作面板 ===== */
  #actionBar {
    position: fixed; right: 26px; bottom: 54px; z-index: 16; display: none;
    width: 440px; max-width: 44vw; padding: 13px 16px 11px; border-radius: 14px;
    background: linear-gradient(180deg, rgba(30,38,48,.98), rgba(17,22,28,.98));
    border: 1px solid #f6c344; box-shadow: 0 16px 44px rgba(0,0,0,.7);
  }
  #actionBar .atitle { font-size: 13px; color: #f6c344; margin-bottom: 10px; letter-spacing: 1px; }
  #actionBar .arow { display: flex; flex-wrap: wrap; gap: 8px; }
  #actionBar button {
    font-size: 13px; padding: 7px 13px; border-radius: 9px; cursor: pointer;
    border: 1px solid #3f4a5e; background: #1e2531; color: #e8e2d5; transition: .15s;
  }
  #actionBar button:hover:not(:disabled) { border-color: #f6c344; color: #f6c344; }
  #actionBar button:disabled { opacity: .3; cursor: not-allowed; }
  #actionBar button.primary { background: linear-gradient(180deg, #f8d165, #e0a92a); color: #12141a; border: none; font-weight: bold; }
  #actionBar button.sel { border-color: #f6c344; background: #2c2716; color: #f6c344; }
  #actionBar .tip { font-size: 11px; color: #7d879a; margin-top: 9px; }
  .seat.you { box-shadow: 0 0 0 2px #58d0c0, 0 10px 26px rgba(0,0,0,.5); }
  .youtag { position: absolute; top: -9px; right: 10px; font-size: 10px; background: #58d0c0; color: #10161a; padding: 1px 7px; border-radius: 7px; font-weight: bold; }
  /* ===== 窄屏降级：纵向列表 ===== */
  @media (max-width: 1080px) {
    body { overflow: auto; }
    #tableWrap { height: auto; margin: 12px; display: flex; flex-direction: column; gap: 10px; }
    #tableWrap::before { display: none; }
    .seat { position: static !important; width: auto !important; transform: none !important; }
    #center { position: static; transform: none; width: auto; height: 340px; }
    .pos1 { order: -1; }
  }
</style>
</head>
<body>
<header>
  <h1>⚔ AI 三国杀 <small>上帝视角</small></h1>
  <div class="hright">
    <div class="status" id="status">等待开局…</div>
    <button id="voiceBtn" title="语音播报开关（首次点击后才会有声，浏览器安全策略）">🔊 配音开</button>
  </div>
</header>

<div id="tableWrap">
  <div id="seats"></div>
  <div id="center">
    <div class="pills">
      <span class="pill gold" id="pRound">第 0 轮</span>
      <span class="pill" id="pPhase">未开局</span>
      <span class="pill" id="pDeck">牌堆 60</span>
    </div>
    <div id="feed"></div>
  </div>
</div>

<div id="board"></div>

<div id="overlay">
  <div class="panel">
    <h2>押一注再开局</h2>
    <p>上帝视角也猜不准。赔率：主公方 ×2.5 ｜ 反贼 ×2.0 ｜ 内奸 ×8.0</p>
    <div class="choice-row">
      <div class="choice sel" data-c="lord">主公方<small>主公或忠臣活到最后</small></div>
      <div class="choice" data-c="rebel">反贼<small>杀死主公即胜</small></div>
      <div class="choice" data-c="traitor">内奸<small>一穿四独赢</small></div>
    </div>
    <input id="amount" type="number" value="10" min="1" max="100">
    <div class="joinrow">
      <label><input type="checkbox" id="joinChk"> 我也上桌</label>
      <select id="joinSeat" disabled>
        <option value="0">随机座位</option>
        <option value="1">1号</option><option value="2">2号</option>
        <option value="3">3号</option><option value="4">4号</option>
        <option value="5">5号</option>
      </select>
      <span style="font-size:11px;color:#7d879a">上桌后关闭上帝视角</span>
    </div>
    <button id="goBtn">开局！</button>
  </div>
</div>
<button id="againFloat">再来一局</button>
<div id="actionBar"></div>

<script>
let snapshot = null, selChoice = 'lord', lastWinner = null;
const feed = document.getElementById('feed');
const seatsEl = document.getElementById('seats');

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
const ROLE_NAME = { lord: '主公', loyal: '忠臣', rebel: '反贼', traitor: '内奸', draw: '平局', unknown: '身份未知' };
const ROLE_COLOR = { lord: '#f6c344', loyal: '#6fbf5a', rebel: '#e05555', traitor: '#b39ddb', unknown: '#4a5162' };
const CARD_CLS = { '杀': 's', '闪': 'd', '桃': 'p', '决斗': 'd', '无中生有': 't', '过河拆桥': 't', '顺手牵羊': 't' };
const BET_NAME = { lord: '主公方', rebel: '反贼', traitor: '内奸' };

function render() {
  if (!snapshot) return;
  document.getElementById('status').innerHTML =
    `第 <b>${snapshot.round}</b> 轮 · ${esc(snapshot.phase)}` +
    (snapshot.bet ? ` · 押了 <b>¥${snapshot.bet.amount}</b> ${esc(BET_NAME[snapshot.bet.choice] || '')}` : '');
  document.getElementById('pRound').textContent = '第 ' + snapshot.round + ' 轮';
  document.getElementById('pPhase').textContent = snapshot.winner ? '对局结束' : snapshot.phase;
  document.getElementById('pDeck').textContent = '牌堆 ' + (snapshot.deck != null ? snapshot.deck : '-');

  // 视角旋转：上桌时把你的座位固定到最下方（pos1），其余按顺位环绕
  const human = snapshot.humanSeat;
  const posOf = (seat) => human ? ((seat - human + 5) % 5) + 1 : seat;

  seatsEl.innerHTML = snapshot.players.map(p => {
    const hpStr = '❤'.repeat(Math.max(p.hp, 0)) +
      `<span class="lost">${'❤'.repeat(Math.max(p.maxHp - Math.max(p.hp, 0), 0))}</span>`;
    const cards = !p.hand.length
      ? (p.handCount > 0 ? `<span class="empty">手牌 ×${p.handCount}（不可见）</span>` : '<span class="empty">（无手牌）</span>')
      : p.hand.map(c => `<span class="card ${CARD_CLS[c] || ''}">${esc(c)}</span>`).join('');
    const acting = !snapshot.winner && (snapshot.phase || '').indexOf(p.seat + '号') === 0;
    return `<div class="seat pos${posOf(p.seat)} ${p.seat === 1 ? 'lord' : ''} ${p.alive ? '' : 'dead'} ${acting ? 'acting' : ''} ${p.you ? 'you' : ''}">
      ${p.alive ? '' : '<div class="deadmark">阵亡</div>'}
      ${p.you ? '<div class="youtag">你</div>' : ''}
      <div class="srow"><span class="sno">${p.seat}号</span><span class="gname">${esc(p.general)}</span>
        <span class="badge" style="background:${ROLE_COLOR[p.role] || '#4a5162'};${p.role === 'unknown' ? 'color:#c3c8d4' : ''}">${ROLE_NAME[p.role] || p.role}</span></div>
      <div class="mname">${esc(p.name)}</div>
      <div class="hp">${hpStr}</div>
      <div class="cards">${cards}</div>
      ${p.thinking ? `<div class="think">${esc(p.thinking)}</div>` : ''}
    </div>`;
  }).join('');
}

function addMsg(ev) {
  const d = document.createElement('div');
  d.className = 'msg ' + ev.type;
  d.textContent = ev.text;
  feed.appendChild(d);
  feed.scrollTop = feed.scrollHeight;
}

async function loadBoard() {
  try {
    const b = await (await fetch('/api/board')).json();
    const rows = Object.entries(b.models || {}).sort((a, x) => x[1].win - a[1].win)
      .map(([k, v]) => `${esc(k)} <b>${v.win}胜/${v.games}场</b>`).join('<span class="tag">　|　</span>');
    const bets = b.bets || {};
    document.getElementById('board').innerHTML =
      `<span class="tag">模型战绩</span>${rows || '暂无'}` +
      `<span class="tag">　|　你的押注</span><b>${bets.win || 0}胜 ${bets.lose || 0}负</b>` +
      `<span class="tag">　|　累计赢</span><b>¥${(bets.earned || 0).toFixed(0)}</b>`;
  } catch (e) {}
}

function fillFeed(events) {
  feed.innerHTML = '';
  for (const ev of events || []) {
    const d = document.createElement('div');
    d.className = 'msg ' + ev.type;
    d.textContent = ev.text;
    feed.appendChild(d);
  }
  feed.scrollTop = feed.scrollHeight;
}

/* ===== 配音（浏览器语音合成，零依赖） ===== */
const SPEAK_TYPES = new Set(['turn', 'round', 'sha', 'dodge', 'hit', 'tao', 'death', 'duel', 'duel-fight', 'duel-lose', 'win', 'bet', 'start']);
const VOICE_KEY = 'sgs_voice_on';
let voiceOn = localStorage.getItem(VOICE_KEY) !== '0';
let voiceUnlocked = false, vBusy = false;
const vq = [];

function pickVoice(deep) {
  if (!window.speechSynthesis) return null;
  const all = speechSynthesis.getVoices().filter(v => /zh[-_]?CN|Chinese/i.test(v.lang + ' ' + v.name));
  if (!all.length) return null;
  const by = n => all.find(v => v.name.indexOf(n) >= 0);
  return deep ? (by('Kangkang') || all[0]) : (by('Huihui') || by('Xiaoxiao') || by('Yaoyao') || all[0]);
}
function speechText(ev) {
  let t = (ev.text || '')
    .replace(/[☠🏆⏱💥🎉💸⚔]/g, '')
    .replace(/[【】]/g, '')
    .replace(/—/g, ' ')
    .replace(/→\s*[\d/]+/g, '')
    .replace(/（[^）]*）/g, '')
    .replace(/\([^)]*\)/g, '')
    .replace(/={2,}/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  if (!t) return '';
  if (ev.type === 'sha') t = '杀！' + t;
  else if (ev.type === 'dodge') t = '闪！' + t;
  else if (ev.type === 'death') t = '阵亡！' + t;
  else if (ev.type === 'duel') t = '决斗！' + t;
  return t;
}
function drainVoice() {
  if (vBusy || !voiceOn || !window.speechSynthesis) return;
  const item = vq.shift();
  if (!item) return;
  const u = new SpeechSynthesisUtterance(item.text);
  const v = pickVoice(item.deep);
  if (v) u.voice = v;
  u.lang = 'zh-CN';
  u.rate = item.rate || 1.05;
  u.pitch = item.pitch || 1;
  u.onend = u.onerror = () => { vBusy = false; setTimeout(drainVoice, 90); };
  vBusy = true;
  try { speechSynthesis.speak(u); } catch (e) { vBusy = false; }
}
function queueVoice(ev) {
  if (!voiceOn || !window.speechSynthesis) return;
  if (ev.type && !SPEAK_TYPES.has(ev.type) && ev.type !== 'force') return;
  const text = speechText(ev);
  if (!text) return;
  const item = { text, deep: ev.type === 'death' || ev.type === 'win' };
  if (ev.type === 'death' || ev.type === 'win') {
    try { speechSynthesis.cancel(); } catch (e) {}
    vBusy = false; vq.length = 0;
    item.rate = ev.type === 'win' ? 1.0 : 0.95;
    item.pitch = ev.type === 'win' ? 1.15 : 0.8;
  } else if (ev.type === 'sha' || ev.type === 'dodge' || ev.type === 'duel') {
    item.rate = 1.18; item.pitch = 1.05;
  } else if (ev.type === 'turn' || ev.type === 'round') {
    item.rate = 1.1;
  }
  vq.push(item);
  while (vq.length > 4) vq.shift();
  drainVoice();
}
const voiceBtn = document.getElementById('voiceBtn');
function paintVoice() {
  voiceBtn.textContent = voiceOn ? '🔊 配音开' : '🔇 配音关';
  voiceBtn.classList.toggle('off', !voiceOn);
  voiceBtn.classList.toggle('pulse', voiceOn && !voiceUnlocked);
}
voiceBtn.onclick = (e) => {
  e.stopPropagation();
  voiceOn = !voiceOn;
  localStorage.setItem(VOICE_KEY, voiceOn ? '1' : '0');
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (err) {} }
  vBusy = false; vq.length = 0;
  if (voiceOn) { voiceUnlocked = true; queueVoice({ type: 'force', text: '配音已开启，全体就座' }); }
  paintVoice();
};
// 浏览器要求先有用户手势才允许发声
function unlockVoice() {
  if (voiceUnlocked || !voiceOn || !window.speechSynthesis) return;
  voiceUnlocked = true;
  try {
    const u = new SpeechSynthesisUtterance('配音已就绪');
    u.lang = 'zh-CN'; u.rate = 1.15;
    const v = pickVoice(false); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
  paintVoice();
}
document.addEventListener('click', unlockVoice);
paintVoice();

/* ===== 真人上桌：操作面板 ===== */
const NEED_TARGET = new Set(['杀', '决斗', '过河拆桥', '顺手牵羊']);
let pendingReq = null, selCardIdx = null;
const barEl = document.getElementById('actionBar');

function hideActionBar() { pendingReq = null; selCardIdx = null; barEl.style.display = 'none'; }
function showActionBar(req) { pendingReq = req; selCardIdx = null; renderActionBar(); }

function renderActionBar() {
  const me = snapshot && snapshot.players ? snapshot.players.find(p => p.you) : null;
  if (!pendingReq || !me || !me.alive) { barEl.style.display = 'none'; return; }
  barEl.style.display = 'block';
  let html = '';
  if (pendingReq.kind === 'play') {
    html += `<div class="atitle">👤 轮到你了（${me.seat}号 ${me.general}）· 手牌 ${me.hand.length} 张</div><div class="arow">`;
    me.hand.forEach((c, i) => {
      const isTao = c === '桃';
      html += `<button data-i="${i}" data-card="${esc(c)}" class="${selCardIdx === i ? 'sel' : ''}" ${isTao ? 'disabled title="出牌阶段不能吃桃"' : ''}>${esc(c)}</button>`;
    });
    html += `<button class="primary" data-act="pass">结束回合</button></div>`;
    if (selCardIdx != null && me.hand[selCardIdx]) {
      const card = me.hand[selCardIdx];
      html += `<div class="arow" style="margin-top:10px">` +
        snapshot.players.filter(p => p.alive && !p.you)
          .map(p => `<button data-target="${p.seat}">${esc(card)} → ${p.seat}号 ${esc(p.general)}</button>`).join('') +
        `</div>`;
    }
    html += `<div class="tip">点牌选中后点目标出牌；【杀】每回合限一次，【无中生有】直接点即用。</div>`;
  } else {
    const card = pendingReq.card || '';
    html += `<div class="atitle">⚡ 需要你响应：${card ? `是否打出【${esc(card)}】？` : ''}</div><div class="arow">` +
      `<button class="primary" data-act="yes">出【${esc(card)}】</button>` +
      `<button data-act="pass">不出</button></div>`;
  }
  barEl.innerHTML = html;
}

barEl.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.act === 'pass') return sendHuman('PASS');
  if (b.dataset.act === 'yes') return sendHuman('出');
  if (b.dataset.target) {
    const me = snapshot.players.find(p => p.you);
    const card = selCardIdx != null ? me.hand[selCardIdx] : null;
    if (!card) return;
    return sendHuman(`${card} ${b.dataset.target}号`);
  }
  if (b.dataset.card) {
    const card = b.dataset.card;
    if (NEED_TARGET.has(card)) { selCardIdx = parseInt(b.dataset.i, 10); renderActionBar(); return; }
    return sendHuman(card);
  }
});

async function sendHuman(action) {
  barEl.querySelectorAll('button').forEach(x => x.disabled = true);
  try {
    await fetch('/api/human', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) });
  } catch (err) {}
  selCardIdx = null;
}

const es = new EventSource('/api/events');
es.onmessage = (m) => {
  const d = JSON.parse(m.data);
  if (d.kind === 'hello') {
    if (d.snapshot) { snapshot = d.snapshot; fillFeed(snapshot.recent); }
    if (d.snapshot && !d.snapshot.winner) document.getElementById('overlay').style.display = 'none';
    if (d.pending && d.snapshot && d.pending.seat === d.snapshot.humanSeat) { showActionBar(d.pending); queueVoice({ type: 'force', text: '轮到你出牌' }); }
  }
  else if (d.kind === 'event') { addMsg(d.event); queueVoice(d.event); snapshot = d.snapshot; }
  else if (d.kind === 'snapshot') snapshot = d.snapshot;
  else if (d.kind === 'human-turn') {
    snapshot = d.snapshot; render();
    showActionBar(d.req);
    queueVoice({ type: 'force', text: d.req.kind === 'play' ? '轮到你出牌' : (d.req.card ? `请决定是否打出${d.req.card}` : '请响应') });
    return;
  }
  else if (d.kind === 'human-clear') { hideActionBar(); return; }
  else if (d.kind === 'human-timeout') { hideActionBar(); }
  render();
  if (snapshot && snapshot.winner && !lastWinner) {
    lastWinner = snapshot.winner;
    hideActionBar();
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('againFloat').style.display = 'block';
    loadBoard();
  }
};

document.querySelectorAll('.choice').forEach(el => el.onclick = () => {
  document.querySelectorAll('.choice').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel'); selChoice = el.dataset.c;
});
document.getElementById('joinChk').onchange = (e) => {
  document.getElementById('joinSeat').disabled = !e.target.checked;
};
document.getElementById('goBtn').onclick = async () => {
  const amount = parseInt(document.getElementById('amount').value, 10) || 10;
  const join = document.getElementById('joinChk').checked;
  const seat = parseInt(document.getElementById('joinSeat').value, 10) || 0;
  document.getElementById('goBtn').disabled = true;
  feed.innerHTML = '';
  lastWinner = null;
  snapshot = null; seatsEl.innerHTML = '';
  hideActionBar();
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  vBusy = false; vq.length = 0;
  document.getElementById('overlay').style.display = 'none';
  await fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ choice: selChoice, amount, join, seat }) });
};
document.getElementById('againFloat').onclick = () => {
  document.getElementById('againFloat').style.display = 'none';
  document.getElementById('goBtn').disabled = false;
  document.getElementById('overlay').style.display = 'flex';
};
loadBoard();
</script>
</body>
</html>
